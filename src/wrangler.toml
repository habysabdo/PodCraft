name = "podcraft"
main = "src/index.js"
compatibility_date = "2026-11-10"

# This tells Cloudflare where your built frontend files are located
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Your D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "podcraft-db"
database_id = "3bc995ca-2a0c-45c0-85a6-cebabd522f91"
